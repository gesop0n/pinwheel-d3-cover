[package]
name = "pinwheel-d3-cover"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Small dominating word families for the 3-task, density <= 5/6 domain of real-period pinwheel scheduling"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
good_lp = { version = "1.15.3", default-features = false, features = ["highs"] }
num-rational = "0.4.2"
num-traits = "0.2.19"
rayon = "1.12.0"

# Exact arithmetic uses fixed-width `Ratio<i128>`; abort instead of silently wrapping on overflow.
[profile.release]
overflow-checks = true
